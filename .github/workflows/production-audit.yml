name: Production QA Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendor-production-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim Android build disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze active application
        run: flutter analyze lib test --no-fatal-warnings --no-fatal-infos
      - name: Flutter tests
        run: flutter test
      - name: Android ARM64 debug smoke compilation
        run: flutter build apk --debug --target-platform android-arm64 --no-pub
